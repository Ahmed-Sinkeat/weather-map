<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Find current weather for a location on a map.">
    <title>WeatherMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>WeatherMap</h1>
      <p>Find the weather where you're going.</p>
    </header>

    <main>
      <form aria-label="Location search">
        <label for="location">City or location</label>
        <input
          id="location"
          name="location"
          type="text"
          placeholder="e.g. Khartoum"
          required
        >
        <button type="submit" disabled aria-describedby="search-status">Get Weather</button>
        <p id="search-status">Weather search is not available yet.</p>
      </form>

      <section aria-labelledby="map-heading">
        <h2 id="map-heading">Weather map</h2>
        <div id="map" role="region" aria-label="Interactive weather map"></div>
        <p id="map-status" role="status">Loading map...</p>
        <noscript>Enable JavaScript to view the map.</noscript>
      </section>
    </main>
  </body>
</html>
