<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Find current weather for a location on a map.">
    <title>WeatherMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>WeatherMap</h1>
      <p>Find the weather where you're going.</p>
    </header>

    <main>
      <form aria-label="Location search">
        <label for="api-key">OpenWeatherMap API key</label>
        <input id="api-key" type="password" value="ffc7e5f5b303bf41be4f1207a1dc9a23" required autocomplete="off"
               aria-describedby="key-help" spellcheck="false">
        <p id="key-help">A temporary key is prefilled. You can replace it with your own OpenWeatherMap key.</p>
        <label for="location">City or location</label>
        <input
          id="location"
          name="location"
          type="text"
          placeholder="e.g. Khartoum"
          required
        >
        <button type="submit" disabled aria-describedby="search-status">Get Weather</button>
        <p id="search-status" role="status">Enter your API key and a city to get current weather.</p>
        <span id="spinner" aria-hidden="true" hidden></span>
      </form>

      <section aria-labelledby="favorites-heading">
        <h2 id="favorites-heading">Favorites</h2>
        <div id="favorites"></div>
      </section>

      <section aria-labelledby="map-heading">
        <h2 id="map-heading">Weather map</h2>
        <div id="map" role="region" aria-label="Interactive weather map"></div>
        <p id="map-status" role="status">Loading map...</p>
        <noscript>Enable JavaScript to view the map and search for weather.</noscript>
      </section>

      <section aria-labelledby="forecast-heading">
        <h2 id="forecast-heading">5-day forecast</h2>
        <p id="forecast-status" role="status">Search for a city to see its 5-day forecast.</p>
        <ul id="forecast-list"></ul>
      </section>
    </main>
  </body>
</html>
